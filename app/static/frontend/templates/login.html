{% extends "base.html" %}
{% block title %}Login - SmartCivic{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 70vh; width: 100%;">
  <div class="card" style="width: 100%; max-width: 450px; background: rgba(30, 41, 59, 0.85);">
    <h2 class="card-title" style="justify-content: center; font-size: 1.75rem; margin-bottom: 1.5rem;">
      <i class="fa-solid fa-right-to-bracket" style="color: var(--primary);"></i> Login to SmartCivic
    </h2>
    <div id="alert-container"></div>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="name@domain.com">
      </div>
      <div class="form-group" style="margin-bottom: 2rem;">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.8rem;">
        Log In
      </button>
    </form>
    <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
      Don't have an account? <a href="/api/auth/register" style="color: var(--primary); text-decoration: none; font-weight: 500;">Register here</a>
    </p>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  document.getElementById("login-form").addEventListener("submit", function(e) {
    e.preventDefault();
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const alertContainer = document.getElementById("alert-container");

    fetch("/api/auth/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ email, password })
    })
    .then(async res => {
      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error || "Authentication failed");
      }
      return data;
    })
    .then(data => {
      alertContainer.innerHTML = `<div class="alert alert-success"><i class="fa-solid fa-circle-check"></i> Login successful! Redirecting...</div>`;
      setTimeout(() => {
        if (data.data.role === "admin") {
          window.location.href = "/admin/dashboard";
        } else if (data.data.role === "worker") {
          window.location.href = "/worker/dashboard";
        } else {
          window.location.href = "/citizen/dashboard";
        }
      }, 1000);
    })
    .catch(err => {
      alertContainer.innerHTML = `<div class="alert alert-danger"><i class="fa-solid fa-circle-exclamation"></i> ${err.message}</div>`;
    });
  });
</script>
{% endblock %}
