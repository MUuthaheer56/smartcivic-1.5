{% extends "base.html" %}
{% block title %}Admin Dashboard - SmartCivic{% endblock %}

{% block extra_head %}
<!-- Leaflet Heatmap Plugin -->
<script src="https://leaflet.github.io/Leaflet.heat/dist/leaflet-heat.js"></script>
<style>
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1.5rem;
    margin-bottom: 2rem;
  }
  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .stat-val {
    font-size: 2rem;
    font-weight: 700;
    font-family: 'Outfit', sans-serif;
  }
  .layer-controls {
    background: rgba(15, 23, 42, 0.9);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 1000;
    color: var(--text-main);
  }
  .control-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.85rem;
    font-weight: 600;
  }
</style>
{% endblock %}

{% block content %}
<div class="stats-grid">
  <div class="stat-card">
    <span style="color: var(--text-muted); font-size: 0.85rem;">Total Complaints</span>
    <span class="stat-val" id="stat-total" style="color: var(--primary);">0</span>
  </div>
  <div class="stat-card">
    <span style="color: var(--text-muted); font-size: 0.85rem;">Pending AI Review</span>
    <span class="stat-val" id="stat-review" style="color: var(--warning);">0</span>
  </div>
  <div class="stat-card">
    <span style="color: var(--text-muted); font-size: 0.85rem;">Available Workers</span>
    <span class="stat-val" id="stat-workers" style="color: var(--success);">0</span>
  </div>
  <div class="stat-card">
    <span style="color: var(--text-muted); font-size: 0.85rem;">Active Outages</span>
    <span class="stat-val" id="stat-outages" style="color: var(--danger);">0</span>
  </div>
</div>

<div class="card" style="position: relative; padding: 0.5rem; overflow: hidden;">
  <div id="map" style="height: 550px; border-radius: 12px; margin: 0; border: none;"></div>
  
  <!-- Custom map layers toggler overlay -->
  <div class="layer-controls">
    <h4 style="font-size: 0.9rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.25rem; margin-bottom: 0.25rem;">Layer Controls</h4>
    <label class="control-item"><input type="checkbox" id="layer-heatmap" checked> Heatmap</label>
    <label class="control-item"><input type="checkbox" id="layer-drains"> Drain Risks</label>
    <label class="control-item"><input type="checkbox" id="layer-coordination"> Coord Failures</label>
    <label class="control-item"><input type="checkbox" id="layer-animals"> Stray Hotspots</label>
    <label class="control-item"><input type="checkbox" id="layer-risk"> CivicPulse Risk</label>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  let adminMap;
  let heatmapLayer;
  let drainLayer = L.layerGroup();
  let coordLayer = L.layerGroup();
  let animalLayer = L.layerGroup();
  let pulseLayer = L.layerGroup();

  document.addEventListener("DOMContentLoaded", () => {
    // Initialize Admin Map
    adminMap = L.map('map').setView([12.9716, 77.5946], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(adminMap);

    // Fetch Stats Cards
    fetch("/api/admin/stats")
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          const stats = res.data;
          document.getElementById("stat-total").textContent = stats.total || 0;
          document.getElementById("stat-review").textContent = stats.by_status.AI_ANALYSIS || 0;
          document.getElementById("stat-workers").textContent = stats.workers_available || 0;
          // Count streetlight outages
          document.getElementById("stat-outages").textContent = stats.by_status.REPORTED || 0;
        }
      });

    // Load Heatmap Data
    fetch("/api/admin/analytics/heatmap")
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          const points = res.data.map(p => [p.lat, p.lng, p.severity * 2]);
          heatmapLayer = L.heatLayer(points, { radius: 25, blur: 15, maxZoom: 10 }).addTo(adminMap);
        }
      });

    // Register Toggler Listeners
    document.getElementById("layer-heatmap").addEventListener("change", function() {
      if (this.checked) { adminMap.addLayer(heatmapLayer); } else { adminMap.removeLayer(heatmapLayer); }
    });
    
    document.getElementById("layer-drains").addEventListener("change", function() {
      if (this.checked) { adminMap.addLayer(drainLayer); loadDrains(); } else { adminMap.removeLayer(drainLayer); }
    });

    document.getElementById("layer-coordination").addEventListener("change", function() {
      if (this.checked) { adminMap.addLayer(coordLayer); loadCoordFailures(); } else { adminMap.removeLayer(coordLayer); }
    });

    document.getElementById("layer-animals").addEventListener("change", function() {
      if (this.checked) { adminMap.addLayer(animalLayer); loadAnimalHotspots(); } else { adminMap.removeLayer(animalLayer); }
    });

    document.getElementById("layer-risk").addEventListener("change", function() {
      if (this.checked) { adminMap.addLayer(pulseLayer); loadCivicPulse(); } else { adminMap.removeLayer(pulseLayer); }
    });
  });

  function loadDrains() {
    drainLayer.clearLayers();
    fetch("/api/admin/analytics/drain-risk")
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          res.data.forEach(d => {
            const color = d.risk_score > 60 ? '#ef4444' : '#f59e0b';
            const circle = L.circle([d.lat, d.lng], {
              color: color, fillColor: color, fillOpacity: 0.4, radius: 150
            }).bindPopup(`<b>Drain:</b> ${d.name}<br><b>Risk:</b> ${d.risk_score}%<br><b>Rain Prob:</b> ${(d.rain_probability*100).toFixed(0)}%`);
            drainLayer.addLayer(circle);
          });
        }
      });
  }

  function loadCoordFailures() {
    coordLayer.clearLayers();
    fetch("/api/admin/analytics/coordination-failures")
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          res.data.forEach(c => {
            const marker = L.marker([c.lat, c.lng], {
              icon: L.icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                iconSize: [25, 41],
                iconAnchor: [12, 41]
              })
            }).bindPopup(`<b>Excavation Collision</b><br><b>Departments:</b> ${c.departments.join(', ')}<br><b>CFI Score:</b> ${c.cfi_score}`);
            coordLayer.addLayer(marker);
          });
        }
      });
  }

  function loadAnimalHotspots() {
    animalLayer.clearLayers();
    fetch("/api/admin/analytics/animal-hotspots")
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          res.data.forEach(h => {
            const circle = L.circle([h.lat, h.lng], {
              color: '#a855f7', fillColor: '#a855f7', fillOpacity: 0.3, radius: 200
            }).bindPopup(`<b>Stray Hotspot</b><br><b>Count:</b> ${h.report_count}<br><b>Types:</b> ${h.animal_types.join(', ')}`);
            animalLayer.addLayer(circle);
          });
        }
      });
  }

  function loadCivicPulse() {
    pulseLayer.clearLayers();
    fetch("/api/admin/analytics/civicpulse")
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          res.data.forEach(r => {
            const color = r.risk_level === "HIGH" ? '#ef4444' : r.risk_level === "MEDIUM" ? '#f59e0b' : '#10b981';
            const rect = L.rectangle([
              [r.lat - 0.00045, r.lng - 0.00045],
              [r.lat + 0.00045, r.lng + 0.00045]
            ], {
              color: color, weight: 1, fillOpacity: 0.35
            }).bindPopup(`<b>CivicPulse Risk Grid</b><br><b>Score:</b> ${r.risk_score}<br><b>Level:</b> ${r.risk_level}`);
            pulseLayer.addLayer(rect);
          });
        }
      });
  }
</script>
{% endblock %}
