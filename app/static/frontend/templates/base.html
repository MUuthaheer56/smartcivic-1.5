<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SmartCivic{% endblock %}</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.7);
      --border-color: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --critical: #dc2626;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Glassmorphism Navigation */
    nav {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-logo {
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s ease, transform 0.2s ease;
      cursor: pointer;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--text-main);
      transform: translateY(-1px);
    }

    .btn {
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: var(--primary-gradient);
      color: #fff;
    }

    .btn-primary:hover {
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
    }

    .btn-outline:hover {
      background: rgba(99, 102, 241, 0.1);
      transform: translateY(-1px);
    }

    .container {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Card styling */
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      margin-bottom: 1.5rem;
    }

    .card-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      margin-bottom: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      background: rgba(15, 23, 42, 0.8);
      margin-top: auto;
    }

    /* Alert Banner */
    .alert {
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .alert-success { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success); color: #34d399; }
    .alert-danger { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: #f87171; }

    /* Forms */
    .form-group {
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    input, select, textarea {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: var(--text-main);
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }

    /* Badges */
    .badge {
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }

    .badge-reporter { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; }
    .badge-verifier { background: rgba(99, 102, 241, 0.2); color: #a5b4fc; }
    .badge-guardian { background: rgba(168, 85, 247, 0.2); color: #d8b4fe; }

    /* Map view height standard */
    #map {
      height: 450px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 1rem;
      z-index: 1;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav>
    <a href="/" class="nav-logo">
      <i class="fa-solid fa-mountain-city"></i> SmartCivic
    </a>
    <div class="nav-links" id="nav-links-container">
      <!-- Links injected dynamically based on cookies / JWT -->
      <a href="/api/auth/login" class="nav-link" id="nav-login-link">Login</a>
      <a href="/api/auth/register" class="nav-link" id="nav-register-link">Register</a>
    </div>
  </nav>

  <div class="container">
    {% block content %}{% endblock %}
  </div>

  <footer>
    &copy; 2026 SmartCivic Platform. Powered by AI Civic Intelligence.
  </footer>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <script>
    // General cookie parser for JWT Double Submit CSRF token checks
    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
    }

    // Dynamic Navigation layout based on login presence
    document.addEventListener("DOMContentLoaded", () => {
      const hasToken = getCookie("access_token") || getCookie("refresh_token");
      const container = document.getElementById("nav-links-container");
      
      if (hasToken) {
        fetch("/api/auth/me")
          .then(res => res.json())
          .then(res => {
            if (res.success) {
              const u = res.data;
              let html = ``;
              if (u.role === "admin") {
                html += `<a href="/admin/dashboard" class="nav-link">Dashboard</a>`;
                html += `<a href="/admin/queue" class="nav-link">AI Review</a>`;
                html += `<a href="/admin/workers" class="nav-link">Workers</a>`;
              } else if (u.role === "worker") {
                html += `<a href="/worker/dashboard" class="nav-link">Dashboard</a>`;
              } else {
                html += `<a href="/citizen/dashboard" class="nav-link">Dashboard</a>`;
                html += `<a href="/citizen/report" class="nav-link">File Report</a>`;
              }
              html += `<a href="/citizen/profile" class="nav-link"><i class="fa-solid fa-user"></i> ${u.name}</a>`;
              html += `<button class="btn btn-outline" onclick="logout()" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">Logout</button>`;
              container.innerHTML = html;
            }
          }).catch(err => {
            // Failed to fetch
          });
      }
    });

    function logout() {
      const csrfToken = getCookie("csrf_access_token");
      fetch("/api/auth/logout", {
        method: "POST",
        headers: {
          "X-CSRF-Token": csrfToken
        }
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          window.location.reload();
        }
      });
    }
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
